  <body class="bg-charcoal-900 text-cream-100 antialiased selection:bg-gold-500 selection:text-charcoal-900 overflow-x-hidden">
    <!-- Inline SVG Noise Filter for Cinematic Texture -->
    <svg class="pointer-events-none fixed isolate z-50 opacity-[0.045] mix-blend-screen h-full w-full" aria-hidden="true">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>
